groups:
  - name: brainbytes-alerts
    rules:
      - alert: BackendDown
        expr: up{job="brainbytes-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "BrainBytes backend is down"
          description: "No metrics have been scraped from the backend for 1 minute."

      - alert: HighErrorRate
        expr: increase(brainbytes_http_requests_total{status=~"5.."}[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "More than 5 server errors (5xx) in the last 5 minutes."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(brainbytes_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency"
          description: "95th percentile request latency is over 1 second for 5 minutes."

      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter is down"
          description: "No metrics have been scraped from node-exporter for 1 minute."

      - alert: CadvisorDown
        expr: up{job="cadvisor"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "cAdvisor is down"
          description: "No metrics have been scraped from cAdvisor for 1 minute."

      # Application/Business Custom Alerts
      - alert: HighAIResponseTime
        expr: rate(brainbytes_ai_response_time_seconds_sum[5m]) / rate(brainbytes_ai_response_time_seconds_count[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High AI response time"
          description: "Average AI response time is over 5 seconds for 5 minutes."

      - alert: HighMobileResponseTime
        expr: rate(brainbytes_mobile_response_time_seconds_sum[5m]) / rate(brainbytes_mobile_response_time_seconds_count[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High mobile response time"
          description: "Average mobile response time is over 5 seconds for 5 minutes."

      - alert: HighDataUsageSent
        expr: sum(increase(brainbytes_data_usage_bytes_total{direction="sent"}[1h])) > 1e9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High data usage (sent)"
          description: "More than 1GB sent in the last hour. Possible abuse or heavy downloads."

      - alert: HighDataUsageReceived
        expr: sum(increase(brainbytes_data_usage_bytes_total{direction="received"}[1h])) > 1e9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High data usage (received)"
          description: "More than 1GB received in the last hour. Possible abuse or heavy uploads."

      - alert: FrequentIntermittentConnectivityEvents
        expr: increase(brainbytes_intermittent_connectivity_events[10m]) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Frequent intermittent connectivity events"
          description: "More than 10 intermittent connectivity events detected in 10 minutes."

      - alert: LowDailyActiveUsers
        expr: brainbytes_daily_active_users < 5
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Low daily active users"
          description: "Less than 5 daily active users in the last 24 hours."

      - alert: NoMessagesForSubject
        expr: sum(rate(brainbytes_messages_per_subject_total[30m])) by (subject) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No messages for a subject"
          description: "No messages have been sent for a subject in the last 30 minutes."